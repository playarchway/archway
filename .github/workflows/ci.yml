name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build Archway.app
        run: scripts/build-app.sh debug
