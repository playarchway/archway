# Weekly version updates, one grouped pull request per ecosystem. Security updates come separately as soon as
# GitHub knows about a vulnerability. The pinned tool downloads for the Wine runtime live in archway-runtime.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: bun
    directory: /services/compatibility
    schedule:
      interval: monthly
    groups:
      compatibility:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
