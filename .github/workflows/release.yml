name: Release

on:
  push:
    branches: [main]

# Runners come from the repository variables MACOS_RUNNER and LINUX_RUNNER, for example Blacksmith labels;
# without them, the jobs use GitHub's own runners.

# Releases are signed with a Developer ID and notarized when these secrets are set (without them, the app is
# signed ad hoc): APPLE_CERTIFICATE_P12 (the base64-encoded .p12 of the Developer ID Application certificate),
# APPLE_CERTIFICATE_PASSWORD, and an App Store Connect API key: APPLE_API_KEY (the .p8's contents),
# APPLE_API_KEY_ID and APPLE_API_ISSUER.

# Release Please runs as Archway Bot when its app ID (variable ARCHWAY_BOT_APP_ID) and key (secret
# ARCHWAY_BOT_PRIVATE_KEY) are set: workflows don't start for pull requests that GITHUB_TOKEN opens.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: bot
        if: vars.ARCHWAY_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ARCHWAY_BOT_APP_ID }}
          private-key: ${{ secrets.ARCHWAY_BOT_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.bot.outputs.token || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Import the signing certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "No signing certificate; the app is signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "The certificate holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "ARCHWAY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build Archway.app
        env:
          ARCHWAY_API_BASE_URL: ${{ vars.ARCHWAY_API_BASE_URL }}
          ARCHWAY_UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          ARCHWAY_SPARKLE_PUBLIC_KEY: ${{ vars.ARCHWAY_SPARKLE_PUBLIC_KEY }}
        run: scripts/build-app.sh release
      - name: Notarize
        if: env.ARCHWAY_SIGN_IDENTITY != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY" > "$key"
          ditto -c -k --keepParent .build/Archway.app "$RUNNER_TEMP/Archway-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Archway-notarize.zip" \
            --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait
          rm "$key"
          xcrun stapler staple .build/Archway.app
          spctl --assess --type exec -vv .build/Archway.app
      - name: Build the disk image
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          dmg="archway-$VERSION.dmg"
          staging="$RUNNER_TEMP/dmg"
          mkdir "$staging"
          ditto .build/Archway.app "$staging/Archway.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Archway -srcfolder "$staging" -format ULFO "$dmg"
          if [[ -n "$ARCHWAY_SIGN_IDENTITY" ]]; then
            codesign --sign "$ARCHWAY_SIGN_IDENTITY" --timestamp "$dmg"
          fi
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - name: Notarize the disk image
        if: env.ARCHWAY_SIGN_IDENTITY != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$API_KEY" > "$key"
          xcrun notarytool submit "$DMG" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait
          rm "$key"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
      # The disk image is both the download and the update: the app finds updates in the newest release's
      # appcast.xml (Sparkle). Its signature needs the private half of ARCHWAY_SPARKLE_PUBLIC_KEY, from the secret
      # SPARKLE_PRIVATE_KEY; without it, the release has no appcast.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          assets=("$DMG")
          if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
            signature="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - "$DMG")"
            notes="$(gh release view "$TAG" --json body --jq .body | gh api markdown -F text=@-)"
            cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Archway</title>
              <item>
                <title>Archway $VERSION</title>
                <pubDate>$(date -R)</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[$notes]]></description>
                <enclosure url="https://github.com/${{ github.repository }}/releases/download/$TAG/$DMG" type="application/octet-stream" $signature/>
              </item>
            </channel>
          </rss>
          XML
            assets+=(appcast.xml)
          fi
          gh release upload "$TAG" "${assets[@]}"
