name: Release

on:
  push:
    branches: [main]

# Release Please runs as Leafline Bot: workflows don't start for pull requests that GITHUB_TOKEN opens.
permissions:
  contents: write

jobs:
  release-please:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LEAFLINE_BOT_APP_ID }}
          private-key: ${{ secrets.LEAFLINE_BOT_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.bot.outputs.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Build Archway.app
        run: scripts/build-app.sh release
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          ditto -c -k --keepParent .build/Archway.app "Archway-$VERSION.zip"
          gh release upload "$TAG" "Archway-$VERSION.zip"
